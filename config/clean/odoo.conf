[options]
db_host = db
db_port = 5432
db_user = odoo
; Dev-only default. Override via ODOO_DB_PASSWORD env var in production.
db_password = odoo
list_db = True
http_port = 8069
proxy_mode = False
data_dir = /var/lib/odoo

; Core Odoo addons only — no OCA, no IPAI, no custom paths.
addons_path = /usr/lib/python3/dist-packages/odoo/addons
