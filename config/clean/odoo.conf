[options]
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
http_port = 8069
proxy_mode = False
; data_dir mirrors Odoo.sh's /home/odoo/data: filestore and sessions.
data_dir = /var/lib/odoo
; logfile mirrors Odoo.sh's /home/odoo/logs separation of logs from code.
logfile = /var/log/odoo/odoo.log

; Core Odoo addons only — no OCA, no IPAI, no custom paths.
addons_path = /usr/lib/python3/dist-packages/odoo/addons
