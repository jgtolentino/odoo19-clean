services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile.clean
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      # odoo-data mirrors Odoo.sh's /home/odoo/data: filestore + sessions
      - odoo-data:/var/lib/odoo
      # odoo-logs mirrors Odoo.sh's /home/odoo/logs: inspectable, disposable
      - odoo-logs:/var/log/odoo
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
  odoo-logs:
